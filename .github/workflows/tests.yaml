name: Tests

on:
  pull_request:
  push:
    branches: [nvg-develop, v2]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install test environment
        run: |
          python -m pip install poetry==2.2.1 python-semantic-release==10.7.0
          poetry config virtualenvs.create false
          poetry install --no-interaction --with dev
      - name: Run tests
        run: python -m pytest --confcutdir=tests -q tests

name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: prepare-release-v2
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/nvg-develop'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open or reuse release PR
        run: |
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/v2...nvg-develop" --jq '.ahead_by')
          if [ "$ahead" = 0 ]; then
            echo 'No commits to promote.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --base v2 --head nvg-develop --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            cat > "$RUNNER_TEMP/release-pr.md" <<'BODY'
          Promote development to the stable major-2 branch.

          Review the existing CI checks and use **Create a merge commit**.
          Approve the workflows if GitHub requests it.
          Merging this PR starts the release workflow.
          BODY
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base v2 --head nvg-develop --title 'chore(release): promote nvg-develop to v2' --body-file "$RUNNER_TEMP/release-pr.md")
          fi
          echo "Release PR: $url" >> "$GITHUB_STEP_SUMMARY"

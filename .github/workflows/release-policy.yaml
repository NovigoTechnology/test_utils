name: Release policy

on:
  pull_request:
    branches: [nvg-develop, v2]

permissions:
  contents: read

jobs:
  release-policy:
    name: Release policy
    if: github.base_ref == 'v2'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Validate promotion source
        run: python .github/scripts/release_flow.py validate --event "$GITHUB_EVENT_PATH"
      - name: Install release tools
        run: python -m pip install python-semantic-release==10.7.0
      - name: Preview release on the proposed merge
        id: version
        run: |
          git switch -c v2
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python .github/scripts/release_version.py --published-releases "$RUNNER_TEMP/releases.json" --source-sha "$SOURCE_SHA"
      - name: Report preview
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
          CHANGED: ${{ steps.version.outputs.changed }}
          BOOTSTRAP: ${{ steps.version.outputs.bootstrap }}
        run: |
          printf 'Version: **%s**\n\nPublishable changes: **%s**\n\nInitial major-2 release: **%s**\n' "$NEXT_VERSION" "$CHANGED" "$BOOTSTRAP" >> "$GITHUB_STEP_SUMMARY"

name: Release

on:
  pull_request:
    branches: [v2]
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-v2
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged
      && github.event.pull_request.head.ref == 'nvg-develop'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: release-v2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v2
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install release tools
        run: python -m pip install python-semantic-release==10.7.0 build==1.3.0
      - name: Read published releases
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Validate reviewed merge or completed publication
        id: context
        run: python .github/scripts/release_flow.py publish-context --event "$GITHUB_EVENT_PATH" --published-releases "$RUNNER_TEMP/releases.json"
      - name: Calculate release
        id: version
        run: python .github/scripts/release_version.py --published-releases "$RUNNER_TEMP/releases.json"
      - name: Publish release
        if: steps.version.outputs.changed == 'true' && steps.context.outputs.already_published != 'true'
        env:
          BOOTSTRAP: ${{ steps.version.outputs.bootstrap }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          args=()
          if [ "$BOOTSTRAP" = 'true' ]; then args+=(--major); fi
          actual=$(semantic-release --noop version --print "${args[@]}")
          test "$actual" = "$EXPECTED_VERSION"
          semantic-release version "${args[@]}"
      - name: Open or update synchronization PR
        run: python .github/scripts/release_flow.py open-mergeback

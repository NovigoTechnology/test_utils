name: Release

on:
  pull_request:
    branches: [v2]
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-v2
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged
      && github.event.pull_request.head.ref == 'nvg-develop'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: release-v2
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v2
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Check promotion or completed publication
        id: promotion
        run: |
          current=$(git rev-parse HEAD)
          if [ "$current" != "$MERGE_SHA" ]; then
            tag=$(git describe --tags --exact-match HEAD)
            [[ "$tag" =~ ^v2\.[0-9]+\.[0-9]+$ ]]
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
            git merge-base --is-ancestor "$MERGE_SHA" HEAD
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            test "$(git rev-parse HEAD^2)" = "$SOURCE_SHA"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.promotion.outputs.publish == 'true'
        with:
          python-version: '3.14'
      - name: Install release tools
        if: steps.promotion.outputs.publish == 'true'
        run: python -m pip install python-semantic-release==10.7.0 build==1.3.0
      - name: Publish stable major 2 release
        if: steps.promotion.outputs.publish == 'true'
        run: |
          args=()
          baseline=$(git tag --list 'v2.*' --sort=-version:refname | awk '/^v2\.[0-9]+\.[0-9]+$/ && !seen++ {print}')
          if [ -z "$baseline" ]; then
            args+=(--major)
          else
            test "$(gh release view "$baseline" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
            git merge-base --is-ancestor "$baseline" "$SOURCE_SHA"
          fi
          version=$(env -u GITHUB_OUTPUT semantic-release --noop version --print "${args[@]}")
          if [[ ! "$version" =~ ^2\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $version is outside major 2; use a separate major release branch."
            exit 1
          fi
          if [ -z "$baseline" ] && [ "$version" != 2.0.0 ]; then
            echo "::error::The first major-2 release must be 2.0.0."
            exit 1
          fi
          echo "Calculated version: **$version**" >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          semantic-release version "${args[@]}"
      - name: Open or reuse synchronization PR
        run: |
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/nvg-develop...v2" --jq '.ahead_by')
          if [ "$ahead" = 0 ]; then
            echo 'Development already contains the release.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --base nvg-develop --head v2 --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            cat > "$RUNNER_TEMP/release-pr.md" <<'BODY'
          Return the published version and changelog to development.

          Review the CI checks and use **Create a merge commit** to preserve tag history.
          Approve the workflows if GitHub requests it.
          Merge this PR before preparing the next release.
          BODY
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base nvg-develop --head v2 --title 'chore(release): synchronize v2 into nvg-develop' --body-file "$RUNNER_TEMP/release-pr.md")
          fi
          echo "Synchronization PR: $url" >> "$GITHUB_STEP_SUMMARY"

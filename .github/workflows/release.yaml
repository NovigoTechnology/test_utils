name: Release

on:
  pull_request:
    branches: [v2]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-v2
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged
      && github.event.pull_request.head.ref == 'nvg-develop'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.NOVIGO_BOT_20250619 }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check publication token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::NOVIGO_BOT_20250619 must be available to this repository.'
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: v2
          fetch-depth: 0
          token: ${{ secrets.NOVIGO_BOT_20250619 }}
      - name: Check merged promotion
        run: |
          if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
            echo '::error::v2 has advanced since this PR; inspect the latest release before retrying.'
            exit 1
          fi
          if [ "$(git rev-parse HEAD^2)" != "$SOURCE_SHA" ]; then
            echo '::error::Promote nvg-develop with Create a merge commit to preserve Conventional Commits.'
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install release tools
        run: python -m pip install python-semantic-release==10.7.0 build==1.3.0
      - name: Calculate and publish version
        run: |
          args=()
          baseline=$(git tag --list 'v2.*' --sort=-version:refname | awk '/^v2\.[0-9]+\.[0-9]+$/ && !seen++ {print}')
          if [ -z "$baseline" ]; then
            args+=(--major)
          else
            gh release view "$baseline" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          version=$(env -u GITHUB_OUTPUT semantic-release --noop version --print "${args[@]}")
          if [[ ! "$version" =~ ^2\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Calculated version $version is outside major 2; publication stopped."
            exit 1
          fi
          if [ -z "$baseline" ] && [ "$version" != 2.0.0 ]; then
            echo '::error::The first release on v2 must be 2.0.0.'
            exit 1
          fi
          echo "Calculated version: **$version**" >> "$GITHUB_STEP_SUMMARY"
          semantic-release version "${args[@]}"

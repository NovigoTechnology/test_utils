name: Release

on:
  pull_request:
    branches: [v2]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-v2
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged
      && github.event.pull_request.head.ref == github.event.repository.default_branch
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.NOVIGO_BOT_20250619 }}
      BASE_BRANCH: v2
      HEAD_BRANCH: nvg-develop
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check publication token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Publication token is missing; configure GH_TOKEN in this workflow.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.NOVIGO_BOT_20250619 }}
      - name: Check merged promotion
        run: |
          if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
            echo "::error::$BASE_BRANCH has advanced since this PR; inspect the latest release before retrying."
            exit 1
          fi
          if [ "$(git rev-parse HEAD^2)" != "$SOURCE_SHA" ]; then
            echo "::error::Promote $HEAD_BRANCH with Create a merge commit to preserve Conventional Commits."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install release tools
        run: python -m pip install python-semantic-release==10.7.0 build==1.3.0
      - name: Calculate and publish version
        run: |
          if [[ ! "$BASE_BRANCH" =~ ^v([1-9][0-9]*)$ ]]; then
            echo "::error::BASE_BRANCH must have the form vN, for example v2 or v3."
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          initial_version="${major}.0.0"
          args=()
          baseline=$(git tag --list "${BASE_BRANCH}.*" --sort=-version:refname | awk -v major="$major" '$0 ~ ("^v" major "\\.[0-9]+\\.[0-9]+$") && !seen++ {print}')
          if [ -z "$baseline" ]; then
            args+=(--major)
          else
            gh release view "$baseline" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          version=$(env -u GITHUB_OUTPUT semantic-release --noop version --print "${args[@]}")
          if [[ ! "$version" =~ ^${major}\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Calculated version $version is outside major $major; publication stopped."
            exit 1
          fi
          if [ -z "$baseline" ] && [ "$version" != "$initial_version" ]; then
            echo "::error::The first release on $BASE_BRANCH must be $initial_version."
            exit 1
          fi
          echo "Calculated version: **$version**" >> "$GITHUB_STEP_SUMMARY"
          semantic-release version "${args[@]}"
